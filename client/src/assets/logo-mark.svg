<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DC8C"/><stop offset="0.5" stop-color="#D9A93E"/><stop offset="1" stop-color="#9C6D1C"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9E55"/><stop offset="1" stop-color="#14652F"/>
    </linearGradient>
    <radialGradient id="ballShade" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E9EEF2"/><stop offset="1" stop-color="#AEB8C2"/>
    </radialGradient>
    <clipPath id="pitchClip"><rect x="146" y="124" width="220" height="264" rx="22"/></clipPath>
  </defs>
  <!-- setas da bússola (diagonais) -->
  <g fill="url(#gold)" stroke="#5E3F0C" stroke-width="3" stroke-linejoin="round">
    <g id="arrow">
      <path d="M256 256 L118 118" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M86 86 L150 104 L128 114 L114 128 L104 150 Z"/>
    </g>
    <use href="#arrow" transform="rotate(90 256 256)"/>
    <use href="#arrow" transform="rotate(180 256 256)"/>
    <use href="#arrow" transform="rotate(270 256 256)"/>
  </g>
  <!-- pontas N S L O -->
  <g fill="url(#gold)" stroke="#5E3F0C" stroke-width="3" stroke-linejoin="round">
    <path d="M256 70 L272 112 L256 104 L240 112 Z"/>
    <path d="M256 442 L272 400 L256 408 L240 400 Z"/>
    <path d="M70 256 L112 240 L104 256 L112 272 Z"/>
    <path d="M442 256 L400 240 L408 256 L400 272 Z"/>
  </g>
  <!-- campo -->
  <rect x="140" y="118" width="232" height="276" rx="26" fill="url(#gold)" stroke="#5E3F0C" stroke-width="3"/>
  <rect x="146" y="124" width="220" height="264" rx="22" fill="url(#grass)"/>
  <g clip-path="url(#pitchClip)">
    <g fill="#FFFFFF" opacity="0.07">
      <rect x="146" y="124" width="220" height="33"/><rect x="146" y="190" width="220" height="33"/>
      <rect x="146" y="256" width="220" height="33"/><rect x="146" y="322" width="220" height="33"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5">
      <rect x="162" y="140" width="188" height="232" rx="4"/>
      <line x1="162" y1="256" x2="350" y2="256"/>
      <circle cx="256" cy="256" r="58"/>
      <rect x="208" y="140" width="96" height="40"/>
      <rect x="208" y="332" width="96" height="40"/>
    </g>
  </g>
  <!-- bola -->
  <circle cx="256" cy="256" r="42" fill="url(#ballShade)" stroke="#1B2530" stroke-width="4"/>
  <g fill="#1B2530">
    <path d="M256 236 L275 250 L268 272 L244 272 L237 250 Z"/>
    <path d="M256 216 L246 222 L256 230 L266 222 Z" opacity="0.9"/>
    <path d="M292 248 L296 262 L284 258 L282 246 Z"/>
    <path d="M220 248 L216 262 L228 258 L230 246 Z"/>
    <path d="M238 290 L250 296 L262 296 L274 290 L262 282 L250 282 Z" opacity="0.9"/>
  </g>
</svg>
