# Verifica o código e gera o app Android (APK) a cada envio.
# O APK fica em "Actions" → execução → "Artifacts" → campinho-conectado-apk.
# Para apontar o app para o servidor publicado, defina a variável do
# repositório API_URL (Settings → Secrets and variables → Actions → Variables).
name: Build

on:
  push:
    branches: [main, reestruturacao]
  workflow_dispatch:

jobs:
  web:
    name: Verificar e compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

  android:
    name: App Android (APK)
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://campinho-conectado.onrender.com' }}
      - run: npx cap add android
        env:
          CAP_SERVER_URL: ${{ vars.API_URL || 'https://campinho-conectado.onrender.com' }}
      - run: npx cap sync android
        env:
          CAP_SERVER_URL: ${{ vars.API_URL || 'https://campinho-conectado.onrender.com' }}
      # O plugin de login Google puxa androidx.browser 1.9, que exige Android 36 / AGP 8.9.
      # O Capacitor 7 usa Android 35 / AGP 8.7, então fixamos a versão compatível.
      - name: Compatibilizar dependências Android
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy { force 'androidx.browser:browser:1.8.0' }
              }
          }
          GRADLE
      # Assina sempre com a mesma chave (android-config/debug.keystore), para que o
      # "Entrar com Google" reconheça o app (SHA-1 cadastrado no Google Cloud).
      - name: Usar a chave fixa de assinatura
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../android-config/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
          }
          GRADLE
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Conferir a assinatura do APK (SHA-1 deve bater com o Google Cloud)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          # Falha o build se a assinatura não for a cadastrada no Google
          grep -qi "SHA-1 digest: 289ace5d2cf3d0bd42994e8762afd645622936d8" /tmp/certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: campinho-conectado-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Publica o APK numa página de download fixa:
      # https://github.com/<dono>/<repo>/releases/download/app-android/campinho-conectado.apk
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk campinho-conectado.apk
          gh release view app-android >/dev/null 2>&1 || gh release create app-android \
            --title "App Android" --prerelease --target "$GITHUB_SHA" \
            --notes "Baixe campinho-conectado.apk no celular Android e instale (permita instalar de fontes desconhecidas)."
          gh release upload app-android campinho-conectado.apk --clobber
